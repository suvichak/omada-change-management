<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>omadawrite</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>omadawrite</h1>
    <div id="health" class="health"></div>
    <div class="who"><span id="user"></span> <button id="logout" class="link">Sign out</button></div>

    <section id="open" class="card"></section>

        <thead><tr><th>#</th><th>Title</th><th>Status</th><th>Submitted</th><th>Approved by</th><th>Closed</th></tr></thead>

      </table>
