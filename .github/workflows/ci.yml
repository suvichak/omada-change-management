name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn httpx cryptography pytest
      - run: python -m pytest -q tests

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit in the PR, not only the last one
      - name: Install gitleaks (checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          tgz=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -fsSLO "$base/$tgz" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tgz\$" gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c
          tar xzf "$tgz" gitleaks
      - name: gitleaks (whole history)
        run: ./gitleaks git . --no-banner --redact -v
      - name: Private identifiers (patterns kept in the PRIVATE_PATTERNS secret)
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
        run: |
          if [ -z "$PRIVATE_PATTERNS" ]; then
            echo "PRIVATE_PATTERNS secret not set, skipping"; exit 0
          fi
          printf '%s\n' "$PRIVATE_PATTERNS" | grep -v '^\s*\(#\|$\)' > /tmp/patterns
          # every commit, not just the tip: a later commit can't hide an earlier leak
          # never print the match: Actions logs of a public repo are public
          if git log -p --all | grep -qEf /tmp/patterns; then
            echo "::error::a private identifier is in this branch's history. Rewrite the branch; don't just add a fix commit."
            exit 1
          fi
